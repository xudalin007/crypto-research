<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"><rect width="760" height="310" fill="#fcfcfb"/><text x="28" y="34" font-size="16" font-weight="700" fill="#1c1917" text-anchor="start">Robinhood Chain 上两类代币：市值与 24 小时成交（百万美元，CoinGecko，10/12）</text><text x="28" y="55" font-size="12" font-weight="400" fill="#57534e" text-anchor="start">橙：市值 · 蓝：24 小时成交 · 两类「市值」性质不同：memecoin 按最后成交价标全部供应，股票代币是全额抵押的发行负债</text><text x="200" y="120" font-size="12" font-weight="400" fill="#1c1917" text-anchor="end">memecoin 分类</text><rect x="210" y="90" width="405.0" height="26" rx="4" fill="#eb6834"/><text x="621.0" y="108" font-size="11" font-weight="400" fill="#1c1917" text-anchor="start">市值 540.0</text><rect x="210" y="122" width="38.0" height="26" rx="4" fill="#2a78d6"/><text x="253.95" y="140" font-size="11" font-weight="400" fill="#1c1917" text-anchor="start">成交 50.6</text><text x="200" y="210" font-size="12" font-weight="400" fill="#1c1917" text-anchor="end">股票代币分类（193 个）</text><rect x="210" y="180" width="108.8" height="26" rx="4" fill="#eb6834"/><text x="324.75" y="198" font-size="11" font-weight="400" fill="#1c1917" text-anchor="start">市值 145.0</text><rect x="210" y="212" width="72.2" height="26" rx="4" fill="#2a78d6"/><text x="288.15" y="230" font-size="11" font-weight="400" fill="#1c1917" text-anchor="start">成交 96.2</text><text x="28" y="290" font-size="12" font-weight="400" fill="#57534e" text-anchor="start">按市值，memecoin 是股票代币的 3.7 倍；按 24 小时成交，股票代币是 memecoin 的 1.9 倍——两个口径给出相反的排序</text></svg>