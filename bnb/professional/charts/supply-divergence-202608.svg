<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Helvetica,Arial,sans-serif'><rect width="720" height="430" fill="#fff"/><text x="24" y="30" font-size="16" font-weight="700" fill="#1c1917">供应机制的分岔：BNB 通缩 –4.56%，ETH 通胀 +0.863%</text><text x="24" y="50" font-size="11.5" fill="#57534e">年化供应变化率。正值＝稀释持有者，负值＝回馈持有者</text>
