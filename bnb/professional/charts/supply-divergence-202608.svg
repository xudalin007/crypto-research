<text x="24" y="378" font-size="11.5" font-weight="700" fill="#1c1917">BNB 是五个资产里唯一供应减少的：2026 前三季度销毁 4,556,939 枚，无任何对应增发。</text>
<text x="24" y="398" font-size="10.5" fill="#57534e">换算成回购收益率 4.20%–4.56%，可与 10 年期美债 4.79% 直接对标——这是五个资产里唯一能这样比的。</text>
<text x="24" y="416" font-size="10.5" fill="#57534e">来源：BNB Chain 官方博客（销毁）、ultrasound.money（ETH）、StakingRewards、CoinGecko。</text>
