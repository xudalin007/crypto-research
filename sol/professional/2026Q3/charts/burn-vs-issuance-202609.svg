<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" width="100%" role="img" aria-label="SOL 日均增发 vs 日均销毁">
<style>
 .t{font:600 15px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1c1917} .s{font:400 11.5px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#57534e}
 .l{font:400 11px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#57534e} .v{font:600 10.5px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1c1917} .ax{stroke:#e7e5e4;stroke-width:1}
</style>
<rect width="620" height="230" fill="none"/>
<text x="0" y="16" class="t">SOL 日均增发 vs 日均销毁</text><text x="0" y="34" class="s">单位：SOL/天 · 增发＝通胀率 3.618% × 总供应 ÷ 365（RPC）；销毁＝基础费 ÷ 2（DefiLlama）</text>
<line x1="150" y1="56" x2="150" y2="190" class="ax"/><text x="150" y="206" class="l" text-anchor="middle">0K</text>
<line x1="264" y1="56" x2="264" y2="190" class="ax"/><text x="264" y="206" class="l" text-anchor="middle">20K</text>
<line x1="379" y1="56" x2="379" y2="190" class="ax"/><text x="379" y="206" class="l" text-anchor="middle">40K</text>
<line x1="493" y1="56" x2="493" y2="190" class="ax"/><text x="493" y="206" class="l" text-anchor="middle">60K</text>
<text x="138" y="81" class="l" text-anchor="end">日均增发（9 月）</text><rect x="150" y="66" width="359.8" height="22" rx="3" fill="#2a78d6"/><text x="518" y="81" class="v">62,961</text>
<text x="138" y="123" class="l" text-anchor="end">日均销毁（9 月）</text><rect x="150" y="108" width="5.1" height="22" rx="3" fill="#eb6834"/><text x="163" y="123" class="v">889</text>
<text x="138" y="165" class="l" text-anchor="end">日均销毁（8 月）</text><rect x="150" y="150" width="4.5" height="22" rx="3" fill="#eb6834"/><text x="163" y="165" class="v">796</text>
<text x="0" y="224" class="s">销毁只抵消增发的 1.41%；不质押的持有人每年被稀释约 3.6%。</text></svg>