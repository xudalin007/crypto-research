<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 272" width="100%" role="img" aria-label="三种情景：2030 年价格参考区间与主观概率">
<style>
 .t{font:600 15px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1c1917} .s{font:400 11.5px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#57534e}
 .l{font:400 11px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#57534e} .v{font:600 11.5px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1c1917}
 .vs{font:600 11px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#fff} .ax{stroke:#e7e5e4;stroke-width:1}
</style>
<rect width="620" height="272" fill="none"/>
<text x="0" y="16" class="t">三种情景：2030 年价格参考区间与主观概率</text><text x="0" y="34" class="s">单位：千美元 · 区间为判断性推演，非模型输出（推导方式见报告 9.4 节）</text>
<line x1="104" y1="62" x2="104" y2="220" class="ax"/>
<text x="104" y="237" class="l" text-anchor="middle">$0K</text>
<line x1="189" y1="62" x2="189" y2="220" class="ax"/>
<text x="189" y="237" class="l" text-anchor="middle">$100K</text>
<line x1="274" y1="62" x2="274" y2="220" class="ax"/>
<text x="274" y="237" class="l" text-anchor="middle">$200K</text>
<line x1="359" y1="62" x2="359" y2="220" class="ax"/>
<text x="359" y="237" class="l" text-anchor="middle">$300K</text>
<line x1="444" y1="62" x2="444" y2="220" class="ax"/>
<text x="444" y="237" class="l" text-anchor="middle">$400K</text>
<text x="90" y="91" class="v" text-anchor="end">乐观</text>
<text x="90" y="105" class="l" text-anchor="end">概率 20%</text>
<rect x="317" y="76" width="170" height="24" rx="4" fill="#1baf7a"/>
<text x="402" y="92" class="vs" text-anchor="middle">$250K – $450K</text>
<text x="90" y="141" class="v" text-anchor="end">中性</text>
<text x="90" y="155" class="l" text-anchor="end">概率 52%</text>
<rect x="223" y="126" width="77" height="24" rx="4" fill="#2a78d6"/>
<text x="309" y="142" class="v">$140K – $230K</text>
<text x="90" y="191" class="v" text-anchor="end">悲观</text>
<text x="90" y="205" class="l" text-anchor="end">概率 28%</text>
<rect x="138" y="176" width="43" height="24" rx="4" fill="#e34948"/>
<text x="190" y="192" class="v">$40K – $90K</text>
<text x="0" y="262" class="s">概率相比 7 月版基本持平，但悲观情景的驱动力已从「储备公司抛售螺旋」（已撤回）换为「美联储启动加息」。</text>
</svg>