<line x1="447" y1="62" x2="447" y2="226" class="ax"/><text x="447" y="243" class="l" text-anchor="middle">$4,000</text>
<line x1="540" y1="62" x2="540" y2="226" class="ax"/><text x="540" y="243" class="l" text-anchor="middle">$5,000</text>
