<svg xmlns="http://www.w3.org/2000/svg" width="760" height="335" viewBox="0 0 760 335" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"><rect width="760" height="335" fill="#fcfcfb"/><text x="28" y="34" font-size="16" font-weight="700" fill="#1c1917" text-anchor="start">LEO 市值 vs 可识别的回购（美元）</text><text x="28" y="55" font-size="12" font-weight="400" fill="#57534e" text-anchor="start">绿：追回 BTC × 80%（承诺下限）× 9/30 BTC 价，未扣成本；前提是附属程序判给 Bitfinex；分母含未知的 iFinex 自持</text><text x="220" y="107" font-size="11" font-weight="400" fill="#1c1917" text-anchor="end">LEO 市值（9/30）</text><rect x="230" y="90" width="440.0" height="26" rx="4" fill="#2a78d6"/><text x="676.0" y="107" font-size="11" font-weight="600" fill="#1c1917" text-anchor="start">约 $83.1 亿</text><text x="220" y="157" font-size="11" font-weight="400" fill="#1c1917" text-anchor="end">承诺下限：主张的全部 BTC</text><rect x="230" y="140" width="388.6" height="26" rx="4" fill="#1baf7a"/><text x="624.6401925391096" y="157" font-size="11" font-weight="600" fill="#1c1917" text-anchor="start">约 $73.4 亿</text><text x="220" y="207" font-size="11" font-weight="400" fill="#1c1917" text-anchor="end">承诺下限：只算查扣地址</text><rect x="230" y="190" width="335.2" height="26" rx="4" fill="#1baf7a"/><text x="571.1624548736463" y="207" font-size="11" font-weight="600" fill="#1c1917" text-anchor="start">约 $63.3 亿</text><text x="220" y="257" font-size="11" font-weight="400" fill="#1c1917" text-anchor="end">近 12 个月常规回购</text><rect x="230" y="240" width="2.0" height="26" rx="4" fill="#eb6834"/><text x="238" y="257" font-size="11" font-weight="600" fill="#1c1917" text-anchor="start">约 $2,520 万</text><text x="28" y="315" font-size="12" font-weight="400" fill="#57534e" text-anchor="start">承诺下限对应额约为市值的 76%–88%；市值 ÷ 近 12 个月常规回购约 330 倍</text></svg>