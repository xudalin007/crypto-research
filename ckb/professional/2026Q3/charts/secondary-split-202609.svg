<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"><rect width="760" height="320" fill="#fcfcfb"/><text x="28" y="34" font-size="16" font-weight="700" fill="#1c1917" text-anchor="start">二次发行的去向：RFC0015 的例子 vs 2026 年 9 月实测</text><text x="28" y="55" font-size="12" font-weight="400" fill="#57534e" text-anchor="start">RFC0015 的 60 / 35 / 5 是说明用的例子，不是协议目标</text><text x="28" y="112" font-size="13" font-weight="400" fill="#1c1917" text-anchor="start">状态占用 → 矿工</text><rect x="220" y="90" width="288.0" height="18" rx="4" fill="#2a78d6" opacity="0.45"/><text x="514.0" y="104" font-size="11" font-weight="400" fill="#57534e" text-anchor="start">例子 60%</text><rect x="220" y="112" width="38.1" height="18" rx="4" fill="#eb6834"/><text x="264.06399999999996" y="126" font-size="11" font-weight="400" fill="#1c1917" text-anchor="start">9 月 7.93%</text><text x="28" y="182" font-size="13" font-weight="400" fill="#1c1917" text-anchor="start">NervosDAO → 存款人</text><rect x="220" y="160" width="168.0" height="18" rx="4" fill="#2a78d6" opacity="0.45"/><text x="394.0" y="174" font-size="11" font-weight="400" fill="#57534e" text-anchor="start">例子 35%</text><rect x="220" y="182" width="66.0" height="18" rx="4" fill="#eb6834"/><text x="292.0" y="196" font-size="11" font-weight="400" fill="#1c1917" text-anchor="start">9 月 13.75%</text><text x="28" y="252" font-size="13" font-weight="400" fill="#1c1917" text-anchor="start">剩余 → 销毁</text><rect x="220" y="230" width="24.0" height="18" rx="4" fill="#2a78d6" opacity="0.45"/><text x="250.0" y="244" font-size="11" font-weight="400" fill="#57534e" text-anchor="start">例子 5%</text><rect x="220" y="252" width="375.9" height="18" rx="4" fill="#eb6834"/><text x="601.9359999999999" y="266" font-size="11" font-weight="400" fill="#1c1917" text-anchor="start">9 月 78.32%</text><text x="28" y="300" font-size="12" font-weight="400" fill="#57534e" text-anchor="start">来源：区块头 dao 字段（ΔC、U/C）与 CKB 浏览器 mining_reward、deposit_compensation 增量</text></svg>