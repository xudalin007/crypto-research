<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"><rect width="760" height="300" fill="#fcfcfb"/><text x="28" y="34" font-size="16" font-weight="700" fill="#1c1917" text-anchor="start">能独立观测到的 OKB（百万枚，10/12）</text><text x="28" y="55" font-size="12" font-weight="400" fill="#57534e" text-anchor="start">三项来源与口径不同，不相加、也不从 2,100 万（发行方口径）里相减</text><text x="290" y="110" font-size="12" font-weight="400" fill="#1c1917" text-anchor="end">OKX 交易所钱包（DefiLlama 追踪地址，X Layer）</text><rect x="300" y="90" width="231.9" height="30" rx="4" fill="#eb6834"/><text x="539.9428571428572" y="110" font-size="11" font-weight="400" fill="#1c1917" text-anchor="start">12.177</text><text x="290" y="160" font-size="12" font-weight="400" fill="#1c1917" text-anchor="end">以太坊 ERC-20 合约 totalSupply</text><rect x="300" y="140" width="8.2" height="30" rx="4" fill="#7d6bd6"/><text x="316.1714285714286" y="160" font-size="11" font-weight="400" fill="#1c1917" text-anchor="start">0.429</text><text x="290" y="210" font-size="12" font-weight="400" fill="#1c1917" text-anchor="end">X Layer 手续费金库（两个合约合计）</text><rect x="300" y="190" width="2.0" height="30" rx="4" fill="#1baf7a"/><text x="310" y="210" font-size="11" font-weight="400" fill="#1c1917" text-anchor="start">2,172 枚</text><line x1="700" y1="80" x2="700" y2="240" stroke="#57534e" stroke-dasharray="4 3"/><text x="700" y="252" font-size="10" font-weight="400" fill="#57534e" text-anchor="middle">21.0（发行方口径）</text><text x="28" y="280" font-size="12" font-weight="400" fill="#57534e" text-anchor="start">交易所钱包含用户存款，不等于 OKX 自有；X Layer 原生总供应本报告尚未独立核验（原则上可由全状态余额求和核验）</text></svg>