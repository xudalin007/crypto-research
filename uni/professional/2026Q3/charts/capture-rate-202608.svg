<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 406" width="720" height="406" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Helvetica,Arial,sans-serif'><rect width="720" height="406" fill="#fff"/><text x="24" y="30" font-size="16" font-weight="700" fill="#1c1917">UNI 业务最大，捕获率最低：每 $100 费用只有 $7.8 到持有人</text><text x="24" y="50" font-size="11.5" fill="#57534e">比值＝归持有人收入 ÷ 协议总费用（30 天）。⚠ 四者机制不同，不可直接排序</text>
<rect x="200" y="100" width="304.9" height="32" rx="4" fill="#1baf7a"/>
<text x="186" y="121" font-size="12.5" font-weight="700" text-anchor="end" fill="#1c1917">HYPE</text>
<text x="514.9" y="114" font-size="12.5" font-weight="700" fill="#1c1917">77.2%</text>
<text x="514.9" y="128" font-size="9.5" fill="#57534e">总费用 $7,171万 → 持有人 $5,535万</text>
<rect x="200" y="148" width="96.0" height="32" rx="4" fill="#2a78d6"/>
<text x="186" y="169" font-size="12.5" font-weight="700" text-anchor="end" fill="#1c1917">ETH</text>
<text x="306.0" y="162" font-size="12.5" font-weight="700" fill="#1c1917">24.3%</text>
<text x="306.0" y="176" font-size="9.5" fill="#57534e">总费用 $1,052万 → 持有人 $255万</text>
<rect x="200" y="196" width="39.5" height="32" rx="4" fill="#2a78d6"/>
<text x="186" y="217" font-size="12.5" font-weight="700" text-anchor="end" fill="#1c1917">BNB / BSC</text>
<text x="249.5" y="210" font-size="12.5" font-weight="700" fill="#1c1917">10.0%</text>
<text x="249.5" y="224" font-size="9.5" fill="#57534e">总费用 $1,734万 → 持有人 $173万</text>
<rect x="200" y="244" width="30.8" height="32" rx="4" fill="#d6006e"/>
<text x="186" y="265" font-size="12.5" font-weight="700" text-anchor="end" fill="#1c1917">UNI</text>
<text x="240.8" y="258" font-size="12.5" font-weight="700" fill="#1c1917">7.8%</text>
<text x="240.8" y="272" font-size="9.5" fill="#57534e">总费用 $1.418亿 → 持有人 $1,110万</text>
<line x1="200" y1="90" x2="200" y2="280" stroke="#57534e" stroke-width="1.5"/>
<text x="60" y="308" font-size="11.5" font-weight="700" fill="#1c1917">⚠ 不存在「全协议 16.7% 目标」：v3 低费率档为四分之一，v4 按池类型分别设定</text>
<text x="24" y="354" font-size="10.5" fill="#57534e">UNI 的总费用是 HYPE 的 1.98 倍，归持有人收入只有它的五分之一——差异全部来自捕获率。</text>
<text x="24" y="372" font-size="10.5" fill="#57534e">部分差距是结构性的：AMM 必须把大部分费用给流动性提供者，订单簿模式不必。UNI 达不到 HYPE 的水平。</text>
<text x="24" y="390" font-size="10.5" fill="#57534e">来源：DefiLlama API（一手），四个资产同口径。</text>
</svg>