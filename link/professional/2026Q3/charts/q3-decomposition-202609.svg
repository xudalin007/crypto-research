<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"><rect width="760" height="310" fill="#fcfcfb"/><text x="28" y="34" font-size="16" font-weight="700" fill="#1c1917" text-anchor="start">Q3 涨幅：实际 vs 按历史 beta 的描述性情景</text><text x="28" y="55" font-size="12" font-weight="400" fill="#57534e" text-anchor="start">6/30 → 9/30，币安 UTC 收盘；beta 用 2025-09-30 至 2026-09-30 日对数收益估计（R² 0.668）</text><text x="250" y="110" font-size="12" font-weight="400" fill="#1c1917" text-anchor="end">LINK 实际</text><rect x="260" y="90" width="379.9" height="30" rx="4" fill="#2a78d6"/><text x="647.909090909091" y="110" font-size="11" font-weight="400" fill="#1c1917" text-anchor="start">+99.5%</text><text x="250" y="160" font-size="12" font-weight="400" fill="#1c1917" text-anchor="end">按 beta 1.317 × BTC 推算</text><rect x="260" y="140" width="227.6" height="30" rx="4" fill="#7d6bd6"/><text x="495.56363636363636" y="160" font-size="11" font-weight="400" fill="#1c1917" text-anchor="start">+59.6%</text><text x="250" y="210" font-size="12" font-weight="400" fill="#1c1917" text-anchor="end">BTC</text><rect x="260" y="190" width="162.8" height="30" rx="4" fill="#57534e"/><text x="430.80727272727273" y="210" font-size="11" font-weight="400" fill="#1c1917" text-anchor="start">+42.64%</text><text x="28" y="265" font-size="12" font-weight="400" fill="#57534e" text-anchor="start">对数拆分：BTC 本身约 51%、beta 高于 1 的部分约 16%、残差约 32%（+22.3，约 1 个季度特质标准差）</text><text x="28" y="285" font-size="12" font-weight="400" fill="#57534e" text-anchor="start">9 月单月：对数超额 +15.6，对照组中位数 +13.2——9 月的超额大部分与对照组同向（样本内描述，非因果归因）</text></svg>