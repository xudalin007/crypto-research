xt x="28" y="400" font-size="12" font-weight="400" fill="#57534e" text-anchor="start">2025-10 至 2026-09：转出 3,743 万枚、储备流入 568 万枚（按枚约 15.2%）；期后 10/09 又转出 1,875 万枚。数量对照，不是买卖盘</text></svg>