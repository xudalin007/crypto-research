<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif'>
<rect width="720" height="320" fill="#fff"/>
<text x="24" y="26" font-size="14" font-weight="700" fill="#1c1917">净增发与已测收入相差约 4,000 倍</text>
<text x="24" y="44" font-size="11" fill="#57534e">横轴为对数刻度（美元/年）。增发为链上实测；coretime 收入由官方链上界面独立确认</text>
<text x="24" y="62" font-size="11" fill="#57534e">⚠️ Asset Hub 的费用收入本报告未测——因此这是盈亏平衡陈述，不是已排除未知项的结论</text>
<rect x="270" y="105.0" width="290.0" height="22" fill="#e34948" rx="4" opacity="0.9"/>
<text x="256" y="121.0" font-size="11" font-weight="700" fill="#1c1917" text-anchor="end">年净增发</text>
<text x="570.0" y="121.0" font-size="11.5" font-weight="700" fill="#1c1917">$6,058 万</text>
<rect x="270" y="155.0" width="47.2" height="22" fill="#2a78d6" rx="4" opacity="0.9"/>
<text x="256" y="171.0" font-size="11" font-weight="700" fill="#1c1917" text-anchor="end">已测到的全部年收入</text>
<text x="327.2" y="171.0" font-size="11.5" font-weight="700" fill="#1c1917">约 $15,065</text>
<rect x="270" y="205.0" width="23.3" height="22" fill="#1baf7a" rx="4" opacity="0.9"/>
<text x="256" y="221.0" font-size="11" font-weight="400" fill="#1c1917" text-anchor="end">　其中 coretime 年化</text>
<text x="303.3" y="221.0" font-size="11.5" font-weight="700" fill="#1c1917">约 $6,646</text>
<rect x="270" y="255.0" width="30.2" height="22" fill="#eb6834" rx="4" opacity="0.9"/>
<text x="256" y="271.0" font-size="11" font-weight="400" fill="#1c1917" text-anchor="end">　其中第三方覆盖的生态费用</text>
<text x="310.2" y="271.0" font-size="11.5" font-weight="700" fill="#1c1917">约 $8,419</text>
<text x="24" y="298" font-size="10.5" fill="#57534e">要让两者相当，未测的 Asset Hub 费用收入需要是已测总和的约 4,000 倍</text>
</svg>