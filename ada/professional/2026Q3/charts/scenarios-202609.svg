or="end" fill="#57534e">概率 22.0%</text><text x="383.5" y="172.0" font-size="12" text-anchor="start" fill="#1c1917" font-weight="700">$0.137 – $0.405</text><rect x="218.6" y="200" width="40.7" height="30" rx="4" fill="#e34948"/><text x="22.0" y="220.0" font-size="13" text-anchor="start" fill="#1c1917" font-weight="700">悲观</text><text x="184.0" y="220.0" font-size="12.5" text-anchor="end" fill="#57534e">概率 64.5%</text><text x="267.4" y="220.0" font-size="12" text-anchor="start" fill="#1c1917" font-weight="700">&lt; $0.137（示意下沿 $0.043）</text><line x1="306.8" y1="88" x2="306.8" y2="248" stroke="#1c1917" stroke-width="1.8" stroke-dasharray="5,4"/><text x="314.8" y="82.0" font-size="11.5" text-anchor="start" fill="#1c1917" font-weight="700">9/30 $0.2465</text><line x1="200" y1="248" x2="590" y2="248" stroke="#57534e" stroke-width="1.5"/><text x="24.0" y="300.0" font-size="10.5" text-anchor="start" fill="#57534e">作者基准＝期望市值不变的随机游走基线（年化波动 82.3%）：期望持平，但 2029 年价格低于现价的概率约 78%。与 8 月版 12/46/42 区间不同，不可比较。</text><text x="24.0" y="316.0" font-size="10.5" text-anchor="start" fill="#57534e">悲观档的概率对应「跌破 2026 年低点 $53.5 亿」这一阈值事件，示意下沿取 ALGO 9/30 市值的 1.5 倍，不影响该档概率。</text></svg>
